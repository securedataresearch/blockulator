- slide: 22
  title: "Decide. Measure. Declare."
  scene: s18_habits.Habits
  sections:
    - name: step
      cue: "Step 6. Assign homework."
    - name: title
      cue: "Rounding is a design decision, like access control."
    - name: decide
      cue: "Decide which way. Not every protocol should change libraries. Spend precision where it pays: long horizons, cancellation, tails, iteration. And decide the direction of every rounding at a unit."
    - name: measure
      cue: "Measure your digits like your gas. Not \"switch libraries\". \"Measure yourself against the reference.\""
    - name: declare
      cue: "Declare what you guarantee, and check it. Fees scale with the computation; errors scale with the amount. What an institution buys is not fewer cents. It is a result that can be reproduced, declared and checked."
  notes:
    - "Decide: for each rounding, which way, and why. Measure: know a calculation's digits the way you know its gas, and check it against a reference. Declare: write down what each operation guarantees, and test or prove it (essay §10)."

