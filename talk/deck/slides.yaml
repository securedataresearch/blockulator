- slide: 19
  title: Two formats
  scene: s15_formats.Formats
  sections:
    - name: bar
      cue: "Two ways to spend 256 bits."
    - name: fixed
      cue: "Fixed point: thirty-eight digits in a known range."
    - name: floating
      cue: "Floating point, binary256: seventy-one digits at any magnitude."
    - name: revert
      cue: "Overflow reverts, because a revert can't be ignored."
    - name: rule
      cue: ""


- slide: 20
  title: What correct costs
  scene: s16_ziv.Ziv
  sections:
    - name: prices
      cue: "On the EVM a multiply is five gas and a wide division four hundred."
    - name: fast
      cue: "Ziv's technique: a fast value with a derived bound; test whether the bound could change the rounding;"
    - name: crosses
      cue: "only then recompute."
    - name: recompute
      cue: ""
    - name: counters
      cue: "For exp, that happens once in twenty-two thousand calls."
    - name: closing
      cue: ""


- slide: 21
  title: Knowing it's right
  scene: s17_proofs.Proofs
  sections:
    - name: test-proof
      cue: "A test checks the inputs it was given. A proof covers every input."
    - name: proven
      cue: "The core arithmetic of both libraries is proven."
    - name: fuzzed
      cue: ""
    - name: tested
      cue: "Every transcendental is swept against a 300-digit reference with every fallback forced: zero misrounded."
    - name: limits
      cue: "Two things no check covers, and they are on the slide."
    - name: closing
      cue: "State your own guarantees this specifically."


- slide: 22
