- slide: 8
  title: "Two formats"
  scene: s15_formats.Formats
  sections:
    - name: step
      cue: "Step 1. Write a superior math library. Then write another."
    - name: bar
      cue: "Two ways to spend 256 bits."
    - name: fixed
      cue: "Fixed point: thirty-eight digits in a known range."
    - name: floating
      cue: "Floating point, binary256: seventy-one digits at any magnitude."
    - name: revert
      cue: "Overflow reverts, because a revert can't be ignored."
  notes:
    - "Sources: contracts/src/bl127/README.md · contracts/src/bl19/README.md. BL19 is laid out as IEEE 754 binary256 (E9): sign · exponent · fraction (236 stored), significand 237 bits with the hidden bit. No NaN, no infinity (K4)."
    - "BL127: sign · integer · fraction, 1 · 127 · 128; about 38 digits of fraction; about ±1.7 × 10^38; the grid ends at 2^−128 (K1, K2). Known range: fixed point · many orders of magnitude: floating point."

- slide: 9
  title: "What correct costs"
  scene: s16_ziv.Ziv
  sections:
    - name: prices
      cue: "On the EVM a multiply is five gas and a wide division four hundred."
    - name: fast
      cue: "Ziv's technique: a fast value with a derived bound; test whether the bound could change the rounding;"
    - name: crosses
      cue: "only then recompute."
    - name: counters
      cue: "For exp, that happens once in twenty-two thousand calls."
  notes:
    - "Sources: MUL 5 gas (the EVM fee schedule); 512-by-256-bit division 393 gas (divh, contracts/src/bl19/README.md:181, V32); docs/benchmarks/sweep.json · gas.json · exp."
    - "A fast value, with a bound derived in the source. BL127 exp: 2,716 → 2,835 gas with the test (+4.4%); 2,716 from contracts/deployments/BL127.md (typical inline gas exp 5,360 → 2,716, V19), 2,835 the median of gas.json .ops.exp.typical.gas.lib. The last stage: 0 of 3,963 inputs."

- slide: 10
  title: "Knowing it's right"
  scene: s17_proofs.Proofs
  sections:
    - name: step
      cue: "Step 2. Prove it. Nobody is going to audit the auditor."
    - name: proven
      cue: "A test checks the inputs it was given. A proof covers every input. The core arithmetic of both libraries is proven."
    - name: fuzzed
      cue: ""
    - name: tested
      cue: "Every transcendental is swept against a reference of up to 300 digits with every fallback forced: zero misrounded."
    - name: limits
      cue: "One limit no check covers, and it is on the slide. The proofs found two bugs. Both were ours. State your own guarantees this specifically."
  notes:
    - "Sources: docs/benchmarks/proofs.json · sweep.json; the transcendental list from contracts/src/bl127/README.md (V34)."
    - "Proven: BL127 17 core operations of 19 (16 by Halmos, sqrt in exact integers); BL19 18 of 24. Fuzzed against the spec: BL127 gavg, hypot · BL19 six · 50,000 runs a test. Swept: BL19 327,488 transcendental results at 300 digits · BL127 168,120 at 200 (455,082 and 212,119 over every operation), 0 misrounded."
    - "Limits: a derived bound could be wrong beyond its sampled margin: the measured error reaches 0.92 of BL127's bound and 0.79 of BL19's (V38). The last stage has no test of its own: a true value within its error of a midpoint would misround; none is known (V26)."
    - "The proofs found two bugs on the way: fixed, now proven (V52: issue #159, fix PR #163 2026-10-23, proofs PR #187 2026-10-27, docs/proofs.md:84–87)."
    - "CHECK THE CUES: the limits cue says two things are on the slide, the slide now shows one (the other is in these notes); the tested cue says a 300-digit reference, BL127's oracle is 200 digits."

- slide: 11
  title: "There is no reference"
  scene: s12_reference.Reference
  sections:
    - name: step
      cue: "Step 3. Deploy it where nobody can change it. Including you."
    - name: address
      cue: "No standard says what exp should return on chain. A correctly rounded library can be that reference:"
    - name: chains
      cue: "one right word for every input, the same address on every chain,"
    - name: call
      cue: "no owner, no upgrade path,"
    - name: closing
      cue: "one call to check."
  notes:
    - "Chains probed 2026-10-29 (chains.json; verify-K.md, 2026-10-29 chain probe); the CLZ-since dates per chain are in chains.json."
    - "No storage · no owner · no upgrade path · source verified (V4). A correct implementation returns the same word (V2, K14)."

- slide: 12
  title: "What is e⁴⁰?"
  scene: s02_exp40.Exp40
  sections:
    - name: step
      cue: "Step 4. Ask it a simple question."
    - name: exact
      cue: "Ask a mathematician what e to the forty is and you get one answer."
    - name: libraries
      cue: "Ask Ethereum and you get three. All three are good."
    - name: blockulator
      cue: "None is the closest value an 18-decimal word can hold. Blockulator's is."
  notes:
    - "Source: docs/benchmarks/edges.json · exp(40)."
    - "Solady · Balancer · PRBMath SD: 2 · 3 · 0 decimals right. Three good answers, none the closest; Blockulator: all 18."
    - "BL127: 39 decimals · BL19: 55 decimals, every one of them right. The full words run to 127 (BL127) and 179 (BL19) decimals; their precision ends at 39 and 55."

- slide: 13
  title: "exp is under everything"
  scene: s03_under.Under
  sections:
    - name: four
      cue: "Every rate, every discount, every option price runs through exp."
    - name: resolve
      cue: "If exp has no canonical value on chain, nothing built on it has one. That is an attack vector."
  notes:
    - "The four formulas (V11): compounding rate (1 + r/n)^nt → e^(nt · ln(1 + r/n)); discount factor e^(−rt); option price N(d) → erfc → e^(−x²); growth curve e^(kt)."

- slide: 14
  title: "Computers round"
  scene: s04_grid.Grid
  sections:
    - name: human
      cue: "A 256-bit word holds finitely many numbers."
    - name: decimal
      cue: "e to the forty is not one of them."
    - name: half
      cue: "Half a unit is the gap that stays."
    - name: snaps
      cue: "The wrong tick, or the wrong direction, is the error we can end."
  notes:
    - "Source: docs/benchmarks/edges.json · exp(40); the 80-decimal truth by mpmath (its first 24 decimals match edges.json)."
    - "e^40 = 235385266837019985.40789991074903480450887161725455546723665125118928916352581695433673399870476756 (to 80 decimals). The 18-decimal libraries' grid: one tick = 10^-18, a whole wei; the correctly rounded WAD answer is 235385266837019985.407899910749034805. BL127's grid: one tick = 2^-128 ≈ 2.9 × 10^-39."
    - "The lower word reads, to 80 decimals, 235385266837019985.40789991074903480450887161725455546723650207538258024203263970057194910881476857; the upper, 235385266837019985.40789991074903480450887161725455546723944081125963596080256154191500472300931524. They part at the 39th decimal. BL127's word is the lower, 0x686c20e8b55b3b8b620a9f8b68ca318e."

- slide: 15
  title: "Measure it"
  scene: s08_ladder.Ladder
  sections:
    - name: step
      cue: "Step 5. Ask everybody else."
    - name: compound
      cue: "We measure gas on every change. Almost nobody measures digits. Ten thousand dollars at ten percent, compounded daily: every library loses a digit each time the steps grow tenfold."
    - name: blockulator
      cue: "BL127 and BL19 start twenty and fifty-two digits higher and keep the gap."
    - name: accrual
      cue: ""
    - name: adaptive
      cue: ""
  notes:
    - "Source: docs/benchmarks/ladder.json · scenarios[compound] / [accrual-continuous] / [adaptive-rate]."
    - "Compound: 18-decimal — Solady · Solmate · PRBMath SD · PRBMath UD · snekmate · Balancer · OpenZeppelin · Uniswap: 14.8; not offered: Aave · Morpho · FraxLend · Euler v2. Accrual (the accrual Aave and Morpho run): not offered OpenZeppelin · Uniswap · Maker · FraxLend · Euler v2. Adaptive (the rate FraxLend and Euler run): not offered OpenZeppelin · Uniswap · Maker · Aave · Morpho."
    - "Blockulator's lines start higher and keep the gap: at N = 10,000, BL19 +52 to +62 digits, BL127 +19 to +20, over the best 18-decimal line (V14)."
    - "CHECK THE CUE: \"nineteen and fifty-two digits higher\" — on the compound chart shown under it the margins are +20 and +52; +19 is the accrual scenario's."

- slide: 16
  title: "The cliff"
  scene: s09_cliff.Cliff
  sections:
    - name: columns
      cue: "Then the cliffs."
    - name: zeros
      cue: "exp of minus forty-two is zero on an 18-decimal grid. Every probability below ten to the minus eighteen is gone."
    - name: bl19
      cue: "BL19 never falls off."
  notes:
    - "Source: docs/benchmarks/edges.json · exp."
    - "The 18-decimal grid is zero from exp(−42) · BL127 has digits to exp(−88) · BL19: 71 digits on every probe (V28). No dot: PRBMath UD rejects negative inputs; no exp: OpenZeppelin · Uniswap · Maker · Aave · Morpho · FraxLend · Euler v2."

- slide: 17
  title: "Real markets, today"
  scene: s10_live.Live
  sections:
    - name: deployed
      cue: "Three hundred and twenty-six live Aave and Morpho markets. The same interest, measured three times: seven correct digits as deployed,"
    - name: bl127
      cue: "thirty in BL127,"
    - name: bl19
      cue: "sixty-seven in BL19. Nobody had complained."
  notes:
    - "Source: docs/benchmarks/accrual-deployed.json · live · block 26,206,698 · 2026-10-16 17:49 UTC."
    - "The same 326 markets: 7 digits as deployed, 30 in BL127, 67 in BL19. Gains: Aave +21.9 digits (BL127) and +32.9 more (BL19); Morpho +23.0 and +36.8."

- slide: 18
  title: "Two failures, one decision"
  scene: s07_two.Two
  sections:
    - name: bands
      cue: ""
    - name: inside
      cue: "Resupply rounded too early. Bunni and Balancer V2 rounded too often: carry the exact value and round once, and the attack stops."
    - name: unit
      cue: "Thetanuts and Balancer V1 rounded at a unit, where no precision helps and only the direction decides who pays."
    - name: box
      cue: "Inside a calculation, precision shrinks error. At a unit, direction decides who pays."
  notes:
    - "[you: Bunni's \"safe in isolation\", if you want it]"
    - "Source: scripts/replays/*.json · incidents.json."
    - "Resupply 0.4999999999999999999995 (to 22 decimals), floored once. Bunni 23.659 (to 3 decimals), floored 44 times: active balance 28 → 4 wei. Balancer V2 17.988250947729518883 (to 18 decimals), mulDown, ×30 cycles."
    - "Thetanuts: two thirds of a unit; ceil → 1 unit would have cost more than it took. Balancer V1 4.499999999999999991 (to 18 decimals), nearest: 1 unit charged for 1.5 units' worth; toward the pool → 5. Who pays? Half a unit."

