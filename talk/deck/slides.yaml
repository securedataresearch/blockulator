    - "BL127 / BL19 keep 0.666667; direction decides: floor 0, ceil 1. Ceil to a raw unit charges 1 on the chain's path and 76,596.174855 tokens per component over the 37 mints, more than the claim took of any one (at most 49,716.431047). Computed off-chain, not observed."

