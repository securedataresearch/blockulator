    - name: check
      cue: "Ten million times zero is zero, so one wei of collateral borrows ten million."
    - name: half
      cue: "The exact rate fails that check five million times over."
    - name: multiplier
      cue: ""
  notes:
    - "Source: scripts/replays/resupply.json · block 22,785,461; ResupplyPairCore.sol:573 `_exchangeRate = 1e36 / IOracle(_exchangeRateInfo.oracle).getPrices(address(collateral));` and :282 `uint256 _ltv = ((_borrowerAmount * _exchangeRate * LTV_PRECISION) / EXCHANGE_PRECISION) / _collateralAmount;`."
    - "The stored rate is an integer. 10^36 ÷ price = 0.499999999999999999999500499500 (to 30 decimals). The limit is 95,000 (95%)."
    - "BL127 / BL19 keep the rate and the LTV exact: insolvent, the borrow reverts. Replayed, not observed."

