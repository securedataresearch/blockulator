    - "Before: index supply 153,054,600,572; flash-borrowed 153,054,600,569 (fee 137,749,140); one claim leaves supply 3 and 1 raw unit of each of 5 components (stored 49,716,431,048 · 23,955,277,334 · 6,378,688,542 · 17,186,382,410 · 10,028,704,388, each drained to 1)."
