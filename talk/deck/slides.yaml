- slide: 16
  title: There is no reference
  scene: s12_reference.Reference
  sections:
    - name: address
      cue: "No standard says what exp should return on chain. A correctly rounded library can be that reference:"
    - name: chains
      cue: "one right word for every input, the same address on every chain,"
    - name: call
      cue: ""
    - name: properties
      cue: "no owner, no upgrade path,"
    - name: closing
      cue: "one call to check."


