name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  fp127:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python deps
        run: uv sync --frozen

      - name: Generated files are current
        run: make gen-check

      - name: Oracle vectors are current
        run: make vectors-check

      - name: Ladder inputs are current
        run: make gen-inputs-check

      - name: The exp/log kernels are their generators' Yul (fits, models, bounds)
        run: |
          uv run scripts/fp256/generators/kernel254.py --check
          uv run scripts/fp127/generators/kernel192.py --check
          uv run scripts/fp127/generators/expk.py --check

      - name: Build (forge for Solidity; stdjson.py for the Yul objects, pinned solc and optimizer sequence)
        run: make build

      - name: Equivalence, behaviour and precision suites
        run: FOUNDRY_FUZZ_RUNS=5000 forge test --match-path "test/fp127/*" -vv | grep -E "PREC|Suite result|tests passed"

      - name: Precision report is current
        run: |
          uv run scripts/fp127/precision_report.py
          git diff --exit-code docs/fp127/precision.json docs/fp127/precision.md

      - name: FP256 tests and precision report
        run: |
          FOUNDRY_FUZZ_RUNS=2000 forge test --match-path "test/fp256/*" -vv | grep -E "PREC|Suite result|tests passed"
          uv run scripts/fp127/precision_report.py --lib fp256
          git diff --exit-code docs/fp256/precision.json docs/fp256/precision.md
          make size-fp256

      - name: Library-page examples
        run: forge test --match-path "test/examples/*"

      - name: Every object equals its inline library (every export, msb-shaped inputs)
        run: forge test --match-path "test/objects/*"

      - name: BlockulatorWad to the last wei (known values, Solady's reverts, fuzzing against exact roots and fullMulDiv)
        run: FOUNDRY_FUZZ_RUNS=5000 forge test --match-path "test/wad/*"

      - name: Typed API (FP127Type, FP256Type) equals the raw libraries; gas both ways, default profile and via_ir
        run: FOUNDRY_FUZZ_RUNS=5000 make typed

      - name: Gas ladder
        run: make bench && cat docs/benchmarks/gas.md

      - name: FP256 gas ladder
        run: make bench-fp256

      - name: Terminal-precision ladder is current
        run: make ladder-check

      - name: Edges dataset is current
        run: make edges-check

      - name: Runtime size
        run: make size

      - name: Inline size table is current (one solc compile per op, legacy and via_ir)
        run: make size-inline-check

      - uses: actions/upload-artifact@v4
        with:
          name: fp127-reports
          path: |
            docs/fp127/precision.json
            docs/fp127/precision.md
            docs/benchmarks/gas.json
            docs/benchmarks/gas.md
            docs/benchmarks/ladder.json
            docs/benchmarks/ladder.md

  proofs:
    runs-on: ubuntu-latest
    # the fast subset only (checks that passed in under 120 s, lemmas, fuzz); the full
    # symbolic runs are local (PROOFS_FULL=1 make proofs). A run past 15 minutes is a regression.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: astral-sh/setup-uv@v5

      - name: Halmos 0.3.3
        run: |
          uv tool install halmos==0.3.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Formal proofs, the CI subset (docs/proofs.md; PROOFS_FULL=1 locally for all)
        run: JOBS=2 SOLVER_THREADS=2 make proofs

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build the site with the pinned Zola
        run: ./build.sh

      - name: Symlinked data reached public/
        run: |
          test -f public/data/ladder.json
          test -f public/data/ops.json
          test -f public/contracts/build/abis/badge-factory-v2.json
          test -f public/contracts/src/identity/badge.vy

      - name: Links and front matter
        run: ./zola check --skip-external-links   # build.sh left the pinned binary here

      - name: Colour guard, digit split, module imports
        run: deno task test
