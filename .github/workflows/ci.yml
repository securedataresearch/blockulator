name: ci

on:
  push:
    branches: [master]
  pull_request:

# a new push to a branch cancels that branch's older runs; master's runs finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  fp127:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Python deps
        run: uv sync --frozen

      - name: No old library names (scripts/gates.py names; deployed salts excepted)
        run: uv run scripts/gates.py --only names

      - name: Generated files are current
        run: make gen-check

      - name: Oracle vectors are current
        run: make vectors-check

      - name: Ladder inputs are current
        run: make gen-inputs-check

      - name: The exp/log kernels, the middle stage and the factorial tables are their generators' Yul (fits, models, bounds)
        run: |
          uv run scripts/fp19/generators/kernel254.py --check
          uv run scripts/fp19/generators/mid254.py --check
          uv run scripts/fp127/generators/kernel192.py --check
          uv run scripts/fp127/generators/expk.py --check
          uv run scripts/fp19/generators/facttab.py --check
          uv run scripts/fp19/generators/erf19.py --check
          uv run scripts/fp127/generators/erf_model.py --check

      - name: FP19's fast-path error bounds hold on their samples (bounds.py, the release gate's check)
        run: uv run scripts/fp19/generators/bounds.py

      - name: Build (forge for Solidity; stdjson.py for the Yul objects, pinned solc and optimizer sequence)
        run: make build

      - name: Equivalence, behaviour and precision suites
        run: FOUNDRY_FUZZ_RUNS=5000 forge test --match-path "test/fp127/*" -vv | grep -E "PREC|Suite result|tests passed"

      - name: Precision report is current
        run: |
          uv run scripts/fp127/precision_report.py
          git diff --exit-code docs/fp127/precision.json docs/fp127/precision.md

      - name: FP19 tests and precision report
        run: |
          FOUNDRY_FUZZ_RUNS=2000 forge test --match-path "test/fp19/*" -vv | grep -E "PREC|Suite result|tests passed"
          uv run scripts/fp127/precision_report.py --lib fp19
          git diff --exit-code docs/fp19/precision.json docs/fp19/precision.md
          make size-fp19

      - name: Library-page examples
        run: forge test --match-path "test/examples/*"

      - name: Every object equals its inline library (every export, msb-shaped inputs)
        run: forge test --match-path "test/objects/*"

      - name: BlockulatorWad to the last wei (known values, Solady's reverts, fuzzing against exact roots and fullMulDiv)
        run: FOUNDRY_FUZZ_RUNS=5000 forge test --match-path "test/wad/*"

      - name: Typed API (FP127Type, FP19Type) equals the raw libraries; gas both ways, default profile and via_ir
        run: FOUNDRY_FUZZ_RUNS=5000 make typed

      - name: Gas ladder
        run: make bench && cat docs/benchmarks/gas.md

      - name: FP19 gas ladder
        run: make bench-fp19

      - name: Terminal-precision ladder is current
        run: make ladder-check

      - name: Edges dataset is current
        run: make edges-check

      - name: Runtime size
        run: make size

      - name: Inline size table is current (one solc compile per op, legacy and via_ir)
        run: make size-inline-check
      - name: npm and Soldeer packages (dry runs; nothing is published)
        run: make pack

      - uses: actions/upload-artifact@v6
        with:
          name: fp127-reports
          path: |
            docs/fp127/precision.json
            docs/fp127/precision.md
            docs/benchmarks/gas.json
            docs/benchmarks/gas.md
            docs/benchmarks/ladder.json
            docs/benchmarks/ladder.md

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build the site with the pinned Zola
        run: ./build.sh

      - name: Symlinked data reached public/
        run: |
          test -f public/data/ladder.json
          test -f public/data/ops.json
          test -f public/contracts/build/abis/badge-factory-v2.json
          test -f public/contracts/src/identity/badge.vy

      - name: Links and front matter
        run: ./zola check --skip-external-links   # build.sh left the pinned binary here

      - name: Colour guard, digit split, module imports
        run: deno task test
