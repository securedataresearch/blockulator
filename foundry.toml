[profile.default]
src = "contracts/src"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"

# Only Solidity and Yul under contracts/src are compiled. Vyper sources and
# archived Huff live beside them and are skipped.
skip = ["contracts/src/**/*.vy", "contracts/src/tools/**", "contracts/src/games/**",
        "contracts/src/market/**", "contracts/src/content/**",
        "contracts/src/identity/**", "contracts/src/interfaces/**"]

solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false

verbosity = 3
ffi = true
gas_limit = "18446744073709551615"

fs_permissions = [
  { access = "read", path = "contracts/build" },
  { access = "read", path = "contracts/archive" },
  { access = "read", path = "contracts/deployments" },
  { access = "read", path = "out" },
  { access = "read", path = "test/fp127/vectors" },
  { access = "read", path = "test/fp256/vectors" },
  { access = "read-write", path = "docs/fp256" },
  { access = "read-write", path = "docs/fp127" },
  { access = "read", path = "scripts" },
  { access = "read-write", path = "docs/benchmarks" }
]

[profile.default.fuzz]
runs = 1000

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC}"


[lint]
lint_on_build = false
