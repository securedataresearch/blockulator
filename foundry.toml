[profile.default]
src = "contracts/src"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"

# Only Solidity and Yul under contracts/src are compiled. Vyper sources and
# archived Huff live beside them and are skipped.
# The deployed Yul objects (contracts/src/*/*.yul) are compiled by
# scripts/fp127/stdjson.py (make build-yul, part of make build): Foundry hands
# every Yul source to one solc call, Yul mode takes exactly one, and the objects
# need solc 0.8.24's optimizer sequence pinned (stdjson.py STEPS_0824: 0.8.38's
# own sequence builds the FP256 core over the 24,576-byte limit), which forge
# cannot set for Yul alone.
skip = ["contracts/src/**/*.vy", "contracts/src/**/*.yul", "contracts/src/tools/**", "contracts/src/games/**",
        "contracts/src/market/**", "contracts/src/content/**",
        "contracts/src/identity/**", "contracts/src/interfaces/**",
        # the deployed-accrual suite imports lib/aave-v3-origin and lib/morpho-blue,
        # which CI does not fetch (update = none); it builds under profile.accrual
        "test/accrual/**"]

# The libraries use the CLZ opcode (EIP-7939): solc >= 0.8.31, evm osaka.
solc_version = "0.8.38"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = false

verbosity = 3
ffi = true
gas_limit = "18446744073709551615"

fs_permissions = [
  { access = "read", path = "contracts/build" },
  { access = "read", path = "contracts/archive" },
  { access = "read", path = "contracts/deployments" },
  { access = "read", path = "out" },
  { access = "read", path = "contracts/src/fp127/ops.json" },
  { access = "read", path = "contracts/src/fp256/ops.json" },
  { access = "read", path = "test/fp127/vectors" },
  { access = "read", path = "test/fp256/vectors" },
  { access = "read-write", path = "docs/fp256" },
  { access = "read-write", path = "docs/fp127" },
  { access = "read", path = "scripts" },
  { access = "read-write", path = "docs/benchmarks" },
  { access = "read-write", path = "cache/sweep" }
]

[profile.default.fuzz]
runs = 1000

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC}"


[lint]
lint_on_build = false

# make accrual-deployed: the default profile plus test/accrual, in its own out/cache
# so switching profiles does not invalidate the main build
[profile.accrual]
out = "out-accrual"
cache_path = "cache-accrual"
skip = ["contracts/src/**/*.vy", "contracts/src/**/*.yul", "contracts/src/tools/**", "contracts/src/games/**",
        "contracts/src/market/**", "contracts/src/content/**",
        "contracts/src/identity/**", "contracts/src/interfaces/**"]

# make profile's build-setting bench: test/profile/ViaIr.t.sol alone, compiled
# through the IR, in its own out/cache (it reads the objects from out/, which
# make build writes under the default profile)
[profile.viair]
src = "test/profile"
test = "test/profile"
script = "test/profile"
out = "out-viair"
cache_path = "cache-viair"
via_ir = true
skip = ["test/profile/gen/**"]
