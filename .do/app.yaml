# DigitalOcean App Platform spec for blockulator.com.
# The app 2aaea661-12ba-43ac-a4ad-bdce3f411070 deploys this repo on every push to master:
# build.sh downloads a pinned Zola and writes public/, served as a plain static site.
# This file is the source of truth; the console does not pick it up by itself.
# To apply it after editing: doctl apps update 2aaea661-12ba-43ac-a4ad-bdce3f411070 --spec .do/app.yaml
# .python-version stays in the repo: App Platform runs buildpack detection even for
# environment_slug html, and the uv lockfile makes the Python buildpack demand it.
name: blockulator
region: sfo
domains:
  - domain: blockulator.com
    type: PRIMARY
    zone: blockulator.com
  - domain: www.blockulator.com
    type: ALIAS
    zone: blockulator.com
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
# enhanced_threat_control is off on purpose: it fronts the site with a Cloudflare
# challenge that returns 403 to any non-browser client, and agents must be able to
# read /llms.txt, /.well-known/agent.json and the data files with plain HTTP.
enhanced_threat_control_enabled: false
features:
  - buildpack-stack=ubuntu-22
static_sites:
  - name: blockulator
    github:
      repo: securedataresearch/blockulator
      branch: master
      deploy_on_push: true
    source_dir: /
    build_command: ./build.sh
    output_dir: public
    environment_slug: html
    # a missing path is answered with 404.html and a real 404 status (catchall_document answered 200, a soft 404);
    # the legacy #/ routes run on / (base.html), so nothing needs a catch-all
    error_document: 404.html
ingress:
  rules:
    - component:
        name: blockulator
      match:
        path:
          prefix: /
