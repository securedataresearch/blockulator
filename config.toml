base_url = "https://blockulator.com"
title = "blockulator"
description = "Blockulator is the definitive source for mathematical precision on the EVM. BL127 keeps 38 digits at 1 and BL19 keeps 71 at any magnitude, each op rounded once and checked on chain, measured against ABDK, Quad, Solady, PRBMath, Balancer, Aave, Morpho and Maker."
compile_sass = false
build_search_index = false
generate_feeds = false
generate_sitemap = true

[markdown]
external_links_target_blank = false
# every Markdown heading carries a link to itself (templates/anchor-link.html), shown on hover
insert_anchor_links = "right"

[extra]
# The repository.
repo = "https://github.com/securedataresearch/blockulator"

# The site's map, in one place: the tabs in each page's banner (templates/pagehead.html), the previous and next links
# under a page (templates/pager.html) and the footer (templates/base.html). A group's pages are read in this order.
[[extra.nav.results]]
label = "Precision"
items = [["/results/", "Overview"], ["/results/ladder/", "Ladder"], ["/results/edges/", "Edges"], ["/results/cdf/", "Normal CDF"]]
[[extra.nav.results]]
label = "Per function"
items = [["/results/ops/", "Per op"], ["/results/wad/", "WAD"]]
[[extra.nav.results]]
label = "In production"
items = [["/results/deployed/", "Deployed"], ["/results/incidents/", "Incidents"]]
[[extra.nav.results]]
label = "Deciding"
items = [["/vs/", "Versus"], ["/proofs/", "Proofs"]]

[[extra.nav.library]]
label = "Formats"
items = [["/library/", "Overview"], ["/library/bl19/", "BL19"], ["/library/bl127/", "BL127"]]
[[extra.nav.library]]
label = "Guides"
items = [["/library/integrating/", "Integrating"], ["/library/migrating/", "Migrating"]]

[[extra.nav.writeup]]
label = ""
items = [["/writeup/", "Write-up"], ["/why/", "Why WAD loses digits"]]

[link_checker]
# GitHub renders heading anchors with JavaScript, so a link checker never finds them.
skip_anchor_prefixes = ["https://github.com/"]

# The shared look (securedataresearch/sdr-ui), pinned. Change it with: deno run -A ../sdr-ui/tools/pin.ts X.Y.Z
# build.sh checks these hashes against the hosted manifest before it builds.
[extra.ui]
version = "0.9.0"
base = "https://ui.securedataresearch.net/v0.9.0/"
css = "sha384-MxgV9D7CbQ9P7hmOUBz2qrsCKKFeW+geQbgy18/ed1kQbPEUVIPtnZF6Z5OO0ZqT"
boot = "sha384-DtK/h6DTZ6qK7ORBVT2ehLYnbmj0kRyng894/ISM6ICFmGSHKyMOkBaXXN/eH4g3"
transitions = "sha384-jCJjdzpoq7ZJFM5B2ij/USrZWs+rmfEMAWlzH5TMRFNQK0Sp0I1yYalQD3qKnePJ"
bg_light = "#f3f4f0"
text_light = "#1b1c1c"
bg_dark = "#0c0e10"
text_dark = "#e2e3df"
