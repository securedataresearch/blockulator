base_url = "https://blockulator.com"
title = "blockulator"
description = "Precision maths for the EVM, rounded once and checked on chain. BL127 keeps 38 digits at 1, BL19 71 at any magnitude, measured against ABDK, Quad, Solady, PRBMath, Balancer, Aave, Morpho and Maker."
compile_sass = false
build_search_index = false
generate_feeds = false
generate_sitemap = true

[markdown]
external_links_target_blank = false

[extra]
# The repository.
repo = "https://github.com/securedataresearch/blockulator"

[link_checker]
# GitHub renders heading anchors with JavaScript, so a link checker never finds them.
skip_anchor_prefixes = ["https://github.com/"]

# The shared look (securedataresearch/sdr-ui), pinned. Change it with: deno run -A ../sdr-ui/tools/pin.ts X.Y.Z
# build.sh checks these hashes against the hosted manifest before it builds.
