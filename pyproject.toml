[project]
name = "blockulator-tools"
version = "0.1.0"
description = "Oracle, generators, and the BL127 Yul generator for blockulator"
requires-python = ">=3.11"
dependencies = [
    "eth-account>=0.13",
    "mpmath>=1.3",
    "pycryptodome>=3.20",
]

[tool.uv]
package = false
# "talk" holds the deck's renderer (manim needs pango and cairo on the machine);
# installed by default locally, skipped in CI with `uv sync --no-group talk`.
default-groups = ["dev", "talk"]

[dependency-groups]
dev = []
talk = [
    "img2pdf>=0.6.3",
    "manim==0.22.1",
    "pyyaml>=6.0.3",
    "qrcode>=8.2",
]
